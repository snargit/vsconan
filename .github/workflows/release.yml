name: Release

# Push a tag like v1.2.3 to build, test and publish a GitHub release with the VSIX attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          # VSIX versions are purely numeric, so pre-release suffixes like -beta aren't allowed.
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Tag '$tag' must look like v1.2.3."
          }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Stamp version into the VSIX manifest
        shell: pwsh
        run: |
          $path = 'src/VsConan/source.extension.vsixmanifest'
          [xml]$manifest = Get-Content $path
          $manifest.PackageManifest.Metadata.Identity.Version = '${{ steps.version.outputs.version }}'
          $manifest.Save((Resolve-Path $path))

      # Full MSBuild from the runner's Visual Studio: 'dotnet build' can't package a VSIX.
      - name: Find MSBuild
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found.' }
          Split-Path $msbuild | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          dotnet --list-sdks

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Conan
        run: |
          pip install "conan>=2,<3"
          conan profile detect

      - name: Build
        run: msbuild VsConan.sln -restore -p:Configuration=Release -p:Version=${{ steps.version.outputs.version }} -v:minimal

      - name: Test
        run: dotnet test tests/VsConan.Core.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $asset = "VsConan-$version.vsix"
          Copy-Item src/VsConan/bin/Release/net48/VsConan.vsix $asset
          gh release create '${{ github.ref_name }}' $asset --title "VsConan $version" --generate-notes --verify-tag
